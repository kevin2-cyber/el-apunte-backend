services:
  postgres:
    image: 'postgres:16-alpine'
    container_name: el-apunte-db-rest
    environment:
      - 'POSTGRES_DB=el_apunte_db_rest'
      - 'POSTGRES_PASSWORD=postgres'
      - 'POSTGRES_USER=postgres'
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: el-apunte-app-rest
    ports:
      - '8081:8081'
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/el_apunte_db_rest
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - postgres

volumes:
  postgres_data:
